<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mega Lua Obfuscator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#09090b; --s:#111114; --s2:#18181b; --b:#27272a;
      --t:#fafafa; --m:#a1a1aa; --a:#8b5cf6; --ah:#7c3aed; --ok:#34d399; --err:#f87171;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
    .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(139,92,246,.2),transparent)}
    .wrap{position:relative;max-width:1100px;margin:0 auto;padding:28px 18px 50px}
    header{text-align:center;margin-bottom:28px}
    .badge{display:inline-block;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);color:#c4b5fd;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:12px}
    h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
    header p{color:var(--m);font-size:14px}
    .card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:16px}
    .label{font-size:12px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    textarea{width:100%;min-height:200px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;padding:12px;resize:vertical;outline:none}
    textarea:focus{border-color:var(--a)}
    #out{min-height:240px}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
    select,input[type=password]{background:var(--s2);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
    select:focus,input:focus{border-color:var(--a)}
    .btn{font-family:inherit;font-size:14px;font-weight:600;padding:10px 20px;border-radius:10px;border:none;cursor:pointer}
    .btn-p{background:var(--a);color:#fff}
    .btn-p:hover:not(:disabled){background:var(--ah)}
    .btn-p:disabled{opacity:.5;cursor:not-allowed}
    .btn-g{background:transparent;color:var(--m);border:1px solid var(--b)}
    .btn-g:hover{background:var(--s2);color:var(--t)}
    .st{font-size:13px;color:var(--m)}
    .st.ok{color:var(--ok)}.st.err{color:var(--err)}
    .stats{font-size:12px;color:var(--m);margin-left:auto}
    .stats strong{color:var(--t)}
    footer{text-align:center;margin-top:28px;font-size:12px;color:#52525b}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <header>
      <div class="badge">Prometheus · IronBrew2 · Hercules · MoonSec</div>
      <h1>Mega Lua Obfuscator</h1>
      <p>Motor multi-engine. <strong>mega</strong> = Prometheus Strong → IB2 (máxima fuerza).</p>
    </header>

    <div class="card">
      <div class="label">Código fuente</div>
      <textarea id="src" spellcheck="false" placeholder='print("hello")'></textarea>
    </div>

    <div class="card">
      <div class="label">Motor / opciones</div>
      <div class="row">
        <label style="color:var(--m);font-size:13px">Engine
          <select id="engine">
            <option value="mega" selected>mega (Prometheus Strong → IB2)</option>
            <option value="prometheus">prometheus only</option>
            <option value="ib2">IronBrew2 only</option>
            <option value="hercules">Hercules only</option>
          </select>
        </label>
        <label style="color:var(--m);font-size:13px">Preset
          <select id="preset">
            <option>Strong</option>
            <option>Medium</option>
            <option>Weak</option>
            <option>Minify</option>
          </select>
        </label>
        <label style="color:var(--m);font-size:13px">API Key
          <input type="password" id="key" placeholder="opcional" style="width:140px" />
        </label>
      </div>
      <div class="row">
        <button class="btn btn-p" id="btn" onclick="run()">Ofuscar</button>
        <button class="btn btn-g" onclick="copyOut()">Copiar</button>
        <button class="btn btn-g" onclick="dl()">Descargar</button>
        <span class="st" id="st"></span>
        <span class="stats" id="stats"></span>
      </div>
    </div>

    <div class="card">
      <div class="label">Resultado ofuscado</div>
      <textarea id="out" readonly spellcheck="false" placeholder="Aquí sale el código ofuscado (puede ser muy grande)..."></textarea>
    </div>
    <footer>Docker + lua5.1 · Deploy en Render con Dockerfile</footer>
  </div>
  <script>
    async function run(){
      const btn=document.getElementById('btn'), st=document.getElementById('st');
      const src=document.getElementById('src').value;
      if(!src.trim()){st.className='st err';st.textContent='Pega código';return}
      btn.disabled=true; st.className='st'; st.textContent='Ofuscando (puede tardar 10–60s)…';
      document.getElementById('stats').textContent='';
      try{
        const h={'Content-Type':'application/json'};
        const k=document.getElementById('key').value.trim(); if(k) h['x-api-key']=k;
        const r=await fetch('/obfuscate',{method:'POST',headers:h,body:JSON.stringify({
          source:src,
          engine:document.getElementById('engine').value,
          preset:document.getElementById('preset').value
        })});
        const d=await r.json();
        if(!d.success) throw new Error(d.error||'fail');
        document.getElementById('out').value=d.code;
        st.className='st ok'; st.textContent='OK · '+d.engine+(d.warning?' · '+d.warning:'');
        document.getElementById('stats').innerHTML='<strong>'+d.timeMs+'</strong> ms · <strong>'+d.originalSize.toLocaleString()+'</strong> → <strong>'+d.obfuscatedSize.toLocaleString()+'</strong> B';
      }catch(e){st.className='st err';st.textContent=e.message}
      finally{btn.disabled=false}
    }
    function copyOut(){const o=document.getElementById('out').value;if(o)navigator.clipboard.writeText(o)}
    function dl(){const o=document.getElementById('out').value;if(!o)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/plain'}));a.download='obfuscated.lua';a.click()}
  </script>
</body>
</html>
