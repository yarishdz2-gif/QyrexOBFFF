<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QyrexOBF</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#07070a; --s:#0f0f14; --s2:#16161d; --b:#2a2a35;
      --t:#f4f4f5; --m:#a1a1aa; --a:#a78bfa; --ah:#8b5cf6; --ok:#34d399; --err:#f87171;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
    .glow{position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(ellipse 70% 45% at 50% -15%,rgba(167,139,250,.22),transparent),
                 radial-gradient(ellipse 50% 30% at 90% 90%,rgba(99,102,241,.08),transparent)}
    .wrap{position:relative;max-width:1080px;margin:0 auto;padding:32px 18px 56px}
    header{text-align:center;margin-bottom:30px}
    .logo{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--a);margin-bottom:10px}
    h1{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:700;letter-spacing:-.04em;margin-bottom:8px}
    header p{color:var(--m);font-size:14px;max-width:520px;margin:0 auto;line-height:1.5}
    .card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px}
    .label{font-size:11px;font-weight:600;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    textarea{width:100%;min-height:210px;background:var(--s2);border:1px solid var(--b);border-radius:12px;color:var(--t);
      font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;padding:14px;resize:vertical;outline:none}
    textarea:focus{border-color:var(--a)}
    #out{min-height:250px}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    select,input[type=password]{background:var(--s2);border:1px solid var(--b);color:var(--t);border-radius:9px;padding:9px 12px;font-size:13px;outline:none}
    .btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px 22px;border-radius:11px;border:none;cursor:pointer;transition:.15s}
    .btn-p{background:linear-gradient(135deg,var(--ah),#6366f1);color:#fff}
    .btn-p:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 0 24px rgba(139,92,246,.35)}
    .btn-p:disabled{opacity:.5;cursor:not-allowed}
    .btn-g{background:transparent;color:var(--m);border:1px solid var(--b)}
    .btn-g:hover{background:var(--s2);color:var(--t)}
    .st{font-size:13px;color:var(--m)}.st.ok{color:var(--ok)}.st.err{color:var(--err)}
    .stats{font-size:12px;color:var(--m);margin-left:auto}.stats strong{color:var(--t)}
    footer{text-align:center;margin-top:32px;font-size:12px;color:#52525b}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <header>
      <div class="logo">QyrexOBF</div>
      <h1>Lua / Luau Obfuscator</h1>
      <p>Pipeline fusionado: <strong>Prometheus Strong → IronBrew2</strong>. Máxima fuerza en un solo botón.</p>
    </header>

    <div class="card">
      <div class="label">Código fuente</div>
      <textarea id="src" spellcheck="false" placeholder='print("hola")'></textarea>
    </div>

    <div class="card">
      <div class="label">QyrexOBF</div>
      <div class="row" style="margin-bottom:12px">
        <label style="color:var(--m);font-size:13px">Modo
          <select id="mode">
            <option value="max" selected>MAX (Prometheus + IB2) — recomendado</option>
            <option value="strong">Solo Prometheus Strong</option>
            <option value="ib2">Solo IronBrew2</option>
            <option value="hercules">Solo Hercules</option>
          </select>
        </label>
        <label style="color:var(--m);font-size:13px">API Key
          <input type="password" id="key" placeholder="opcional" style="width:130px" />
        </label>
      </div>
      <div class="row">
        <button class="btn btn-p" id="btn" onclick="run()">Ofuscar con QyrexOBF</button>
        <button class="btn btn-g" onclick="copyOut()">Copiar</button>
        <button class="btn btn-g" onclick="dl()">Descargar</button>
        <span class="st" id="st"></span>
        <span class="stats" id="stats"></span>
      </div>
    </div>

    <div class="card">
      <div class="label">Resultado</div>
      <textarea id="out" readonly spellcheck="false" placeholder="Output ofuscado (puede ser muy grande)…"></textarea>
    </div>
    <footer>QyrexOBF · Deploy con Dockerfile en Render (incluye lua5.1)</footer>
  </div>
  <script>
    async function run(){
      const btn=document.getElementById('btn'), st=document.getElementById('st');
      const src=document.getElementById('src').value;
      if(!src.trim()){st.className='st err';st.textContent='Pega código';return}
      btn.disabled=true; st.className='st'; st.textContent='QyrexOBF trabajando… (10–90s)';
      document.getElementById('stats').textContent='';
      try{
        const h={'Content-Type':'application/json'};
        const k=document.getElementById('key').value.trim(); if(k) h['x-api-key']=k;
        const r=await fetch('/obfuscate',{method:'POST',headers:h,body:JSON.stringify({
          source:src, mode:document.getElementById('mode').value
        })});
        const d=await r.json();
        if(!d.success) throw new Error(d.error||'Error');
        document.getElementById('out').value=d.code;
        st.className='st ok';
        st.textContent='OK · '+(d.engine||'QyrexOBF')+(d.steps?' · '+d.steps.join(' → '):'')+(d.warning?' · '+d.warning:'');
        document.getElementById('stats').innerHTML='<strong>'+d.timeMs+'</strong> ms · <strong>'+d.originalSize.toLocaleString()+'</strong> → <strong>'+d.obfuscatedSize.toLocaleString()+'</strong> B';
      }catch(e){st.className='st err';st.textContent=e.message}
      finally{btn.disabled=false}
    }
    function copyOut(){const o=document.getElementById('out').value;if(o)navigator.clipboard.writeText(o)}
    function dl(){const o=document.getElementById('out').value;if(!o)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/plain'}));a.download='qyrex_obfuscated.lua';a.click()}
  </script>
</body>
</html>
