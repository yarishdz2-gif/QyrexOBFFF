<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf 1.6.7</title>
<meta name="description" content="Qyrex Obfuscator v1.6.7"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050508;--panel:#0c0c12;--line:rgba(255,255,255,.07);
  --fg:#ececf2;--dim:#7a7a8c;--hi:#c4b5fd;--hi2:#a78bfa;
  --ok:#4ade80;--err:#fb7185;--r:16px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Syne",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--disp)}
body{background-image:
  radial-gradient(1200px 600px at 10% -10%,rgba(167,139,250,.12),transparent 55%),
  radial-gradient(900px 500px at 100% 0%,rgba(99,102,241,.08),transparent 50%)}
.shell{max-width:1180px;margin:0 auto;padding:32px 18px 72px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.brand h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.brand p{margin-top:8px;color:var(--dim);font-size:14px;font-family:var(--mono);max-width:520px;line-height:1.5}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.02)}
.pill.hi{color:var(--hi);border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.08)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
button{
  appearance:none;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:14px;
  font-family:inherit;cursor:pointer;transition:.15s transform,.15s opacity,.15s background
}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
.bp{background:linear-gradient(135deg,var(--hi2),#818cf8);color:#0b0b12}
.bp:hover{filter:brightness(1.06)}
.bg{background:transparent;color:var(--fg);border:1px solid var(--line)}
.bg:hover{background:rgba(255,255,255,.04)}
.meta{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:920px){.grid{grid-template-columns:1fr}.meta{margin-left:0;width:100%}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:460px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);font-family:var(--mono)}
.ch b{color:var(--fg);font-family:var(--disp);font-size:13px}
textarea{
  flex:1;width:100%;border:0;outline:0;resize:none;padding:14px 16px;
  background:transparent;color:var(--fg);font-family:var(--mono);font-size:12.5px;line-height:1.55
}
#out{color:#d4d4f0}
.foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;color:var(--dim);font-size:12px;font-family:var(--mono)}
.toast{position:fixed;bottom:22px;right:22px;background:#17171f;border:1px solid var(--line);color:var(--fg);padding:12px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-family:var(--mono)}
.toast.show{opacity:1}
.toast.ok{border-color:rgba(74,222,128,.35);color:var(--ok)}
.toast.err{border-color:rgba(251,113,133,.35);color:var(--err)}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <h1>QyrexObf <span style="color:var(--hi)">1.6.7</span></h1>
      <p>Symbolic overload · payload en <code style="color:var(--hi)">0-9A-Za-z!#$%&amp;/()=?@_:;+*~[]{}</code> · sin Base64 · sin XOR</p>
    </div>
    <div class="pills">
      <span class="pill hi">MAX PROTECT</span>
      <span class="pill">anti-tamper stack</span>
      <span class="pill">integrity hash</span>
      <span class="pill">dense symbols</span>
    </div>
  </div>

  <div class="actions">
    <button class="bp" id="runBtn" onclick="runObf()">Ofuscar</button>
    <button class="bg" onclick="copyOut()">Copiar</button>
    <button class="bg" onclick="dlOut()">Descargar .lua</button>
    <button class="bg" onclick="clearAll()">Limpiar</button>
    <div class="meta" id="stats">listo</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="ch"><b>Source</b><span>Luau input</span></div>
      <textarea id="src" spellcheck="false" placeholder="-- pega tu script Luau
print(&quot;hola&quot;)"></textarea>
    </div>
    <div class="card">
      <div class="ch"><b>Protected output</b><span>QyrexObf 1.6.7</span></div>
      <textarea id="out" spellcheck="false" readonly placeholder="output ofuscado..."></textarea>
    </div>
  </div>

  <div class="foot">
    <span>POST /api/obfuscate · {"source":"..."}</span>
    <span>QyrexObf 1.6.7 · symbolic engine</span>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
function toast(msg, kind){
  const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||'');
  clearTimeout(t._x); t._x=setTimeout(()=>t.className='toast',2200);
}
function clearAll(){ $('src').value=''; $('out').value=''; $('stats').textContent='listo'; }
async function runObf(){
  const source=$('src').value;
  if(!source.trim()){ toast('source vacío','err'); return; }
  const btn=$('runBtn'); btn.disabled=true; $('stats').textContent='procesando...';
  try{
    const r=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'error');
    $('out').value=j.code;
    const s=j.stats||{};
    $('stats').textContent=`${s.inputBytes||0} → ${s.outputBytes||0} B · ${s.mode||'QyrexObf'}`;
    toast('listo','ok');
  }catch(e){ toast(e.message||'error','err'); $('stats').textContent='error'; }
  finally{ btn.disabled=false; }
}
async function copyOut(){
  const v=$('out').value; if(!v){ toast('nada que copiar','err'); return; }
  try{ await navigator.clipboard.writeText(v); toast('copiado','ok'); }
  catch{ toast('no se pudo copiar','err'); }
}
function dlOut(){
  const v=$('out').value; if(!v){ toast('nada que descargar','err'); return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([v],{type:'text/plain'}));
  a.download='qyrexobf_1.6.7.lua'; a.click(); URL.revokeObjectURL(a.href);
  toast('descarga','ok');
}
</script>
</body>
</html>
