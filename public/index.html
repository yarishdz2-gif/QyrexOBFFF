<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf 1.0.0</title>
<style>
:root{--bg:#06060c;--p:#0d0d16;--b:#1e1e2e;--t:#e8e8f0;--m:#7a7a94;--a:#8b5cf6;--c:#22d3ee;--g:#22c55e;--w:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:ui-monospace,system-ui,monospace;background:radial-gradient(900px 500px at 10% -10%,rgba(139,92,246,.14),transparent 55%),var(--bg);color:var(--t);padding:24px 16px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.7rem;background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);font-size:.8rem;margin:6px 0 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.badge{font-size:.72rem;color:var(--c);border:1px solid var(--b);padding:6px 12px;border-radius:999px}
.tokens{background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(34,211,238,.12));border:1px solid var(--b);padding:8px 14px;border-radius:12px;font-weight:700}
.tokens span{color:var(--w)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.grid{grid-template-columns:1.4fr .8fr}}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px}
label{display:block;font-size:.68rem;color:var(--m);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
textarea{width:100%;min-height:180px;background:#08080f;color:var(--t);border:1px solid var(--b);border-radius:10px;padding:12px;font:13px/1.45 ui-monospace,monospace;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{border:0;cursor:pointer;font-family:inherit;font-weight:700;padding:10px 14px;border-radius:9px}
.main{background:linear-gradient(135deg,var(--a),#6d28d9);color:#fff}
.ghost{background:rgba(255,255,255,.05);color:var(--t);border:1px solid var(--b)}
.buy{background:linear-gradient(135deg,#f59e0b,#d97706);color:#111}
.stats{margin-top:8px;font-size:.72rem;color:var(--m);word-break:break-all}
.mission{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;background:#0a0a12}
.mission h3{font-size:.9rem;margin-bottom:4px}
.mission p{font-size:.75rem;color:var(--m);margin-bottom:8px}
.mission .prog{height:6px;background:#1a1a28;border-radius:99px;overflow:hidden}
.mission .bar{height:100%;background:linear-gradient(90deg,var(--a),var(--c));width:0%;transition:width .3s}
.mission.done{border-color:rgba(34,197,94,.4)}
.mission.done h3::after{content:" ✓";color:var(--g)}
.hint{font-size:.72rem;color:var(--m);margin-top:8px}
select{background:#08080f;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>QYREXOBF</h1>
      <p class="sub">qyrex.hopto.org · Luau · 21 capas · solo símbolos</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span class="badge">v1.0.0</span>
      <div class="tokens">Tokens: <span id="tok">0</span></div>
      <button class="buy" id="buy">Comprar tokens</button>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <label>Input Luau</label>
        <textarea id="in" placeholder='print("xd")'></textarea>
        <div class="row">
          <label style="margin:0;letter-spacing:0;text-transform:none;color:var(--m)">Capas extra</label>
          <select id="layers">
            <option value="20" selected>20 (máxima)</option>
            <option value="10">10</option>
            <option value="5">5</option>
            <option value="1">1</option>
          </select>
          <button class="main" id="go">Obfuscate (−1 token)</button>
          <button class="ghost" id="ex">Example</button>
          <button class="ghost" id="copy">Copy</button>
        </div>
        <div class="stats" id="stats"></div>
        <p class="hint">Cada ofuscación gasta 1 token. Completa misiones para ganar tokens gratis.</p>
      </div>
      <div class="card" style="margin-top:12px">
        <label>Output</label>
        <textarea id="out" readonly style="min-height:160px"></textarea>
      </div>
    </div>

    <div class="card">
      <label>Misiones</label>
      <div id="missions"></div>
      <p class="hint">Los tokens se guardan en este navegador. “Comprar tokens” abre el flujo de compra (configura tu link de pago).</p>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const STORE='qyrex_obf_v1';
const BUY_URL='https://qyrex.hopto.org'; // cambia a tu Stripe/PayPal/Discord shop

const defaultState={tokens:3,obfuscations:0,claimed:{}};
function load(){try{return Object.assign({},defaultState,JSON.parse(localStorage.getItem(STORE)||'{}'));}catch{return {...defaultState}}}
function save(s){localStorage.setItem(STORE,JSON.stringify(s));$('tok').textContent=s.tokens}

const MISSIONS=[
  {id:'m1',title:'Primera ofuscación',desc:'Ofusca 1 script',need:1,reward:1},
  {id:'m2',title:'Doble ronda',desc:'Ofusca 2 scripts → +2 tokens',need:2,reward:2},
  {id:'m3',title:'Cinco capas de práctica',desc:'Ofusca 5 scripts → +3 tokens',need:5,reward:3},
  {id:'m4',title:'Veterano',desc:'Ofusca 10 scripts → +5 tokens',need:10,reward:5},
  {id:'m5',title:'Grind',desc:'Ofusca 25 scripts → +10 tokens',need:25,reward:10},
];

function renderMissions(s){
  const el=$('missions');el.innerHTML='';
  for(const m of MISSIONS){
    const prog=Math.min(s.obfuscations,m.need);
    const pct=Math.round(prog/m.need*100);
    const done=!!s.claimed[m.id];
    const canClaim=!done && s.obfuscations>=m.need;
    const div=document.createElement('div');
    div.className='mission'+(done?' done':'');
    div.innerHTML=`<h3>${m.title}</h3><p>${m.desc} · Recompensa: <b style="color:var(--w)">+${m.reward} tokens</b></p>
      <div class="prog"><div class="bar" style="width:${pct}%"></div></div>
      <div class="row" style="margin-top:8px"><span style="font-size:.72rem;color:var(--m)">${prog}/${m.need}</span>
      ${done?'<span style="color:var(--g);font-size:.75rem">Reclamada</span>':canClaim?'<button class="main" data-claim="'+m.id+'">Reclamar</button>':''}
      </div>`;
    el.appendChild(div);
  }
  el.querySelectorAll('[data-claim]').forEach(btn=>{
    btn.onclick=()=>{
      const st=load();
      const m=MISSIONS.find(x=>x.id===btn.dataset.claim);
      if(!m||st.claimed[m.id]||st.obfuscations<m.need)return;
      st.claimed[m.id]=true;st.tokens+=m.reward;save(st);renderMissions(st);
      $('stats').textContent=`Misión completada: +${m.reward} tokens`;
    };
  });
}

$('ex').onclick=()=>$('in').value='print("xd")';
$('buy').onclick=()=>{
  const st=load();
  // demo: +5 tokens (sustituye por checkout real)
  if(confirm('¿Abrir tienda / sumar 5 tokens de demo?')){
    st.tokens+=5;save(st);
    window.open(BUY_URL,'_blank');
  }
};
$('copy').onclick=()=>navigator.clipboard.writeText($('out').value||'');
$('go').onclick=async()=>{
  const st=load();
  if(st.tokens<1){$('stats').textContent='Sin tokens. Completa misiones o compra tokens.';return;}
  try{
    const r=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('in').value,extraLayers:Number($('layers').value)})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'fail');
    st.tokens-=1;st.obfuscations+=1;save(st);renderMissions(st);
    $('out').value=j.code;
    $('stats').textContent=JSON.stringify(j.stats)+' · -1 token';
  }catch(e){$('stats').textContent=String(e)}
};

const state=load();save(state);renderMissions(state);
</script>
</body>
</html>
