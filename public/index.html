<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf 1.0.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-monospace,monospace;background:#0a0a0f;color:#e4e4e7;min-height:100vh;padding:24px}
h1{color:#a78bfa;margin-bottom:8px;font-size:1.4rem}
.sub{color:#71717a;margin-bottom:20px;font-size:.85rem}
textarea{width:100%;min-height:180px;background:#12121a;border:1px solid #27272a;border-radius:10px;color:#e4e4e7;padding:14px;font-size:13px;resize:vertical}
button{margin-top:12px;background:#7c3aed;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
button:hover{background:#6d28d9}
pre{margin-top:16px;background:#12121a;border:1px solid #27272a;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:420px;overflow:auto}
.stats{color:#a1a1aa;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>QyrexObf 1.0.0</h1>
<p class="sub">qyrex.hopto.org — symbol payload · anti-tamper · single-line</p>
<textarea id="in" placeholder="print(&quot;EXECUTED_OK&quot;)"></textarea>
<br/>
<button id="go">Obfuscate</button>
<button id="copy" style="background:#3f3f46">Copy</button>
<div class="stats" id="stats"></div>
<pre id="out"></pre>
<script>
const inEl=document.getElementById('in'), out=document.getElementById('out'), stats=document.getElementById('stats');
document.getElementById('go').onclick=async()=>{
  stats.textContent='...';
  try{
    const r=await fetch('/api/obfuscate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:inEl.value})});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'fail');
    out.textContent=j.code;
    stats.textContent=JSON.stringify(j.stats);
  }catch(e){stats.textContent=String(e);out.textContent='';}
};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(out.textContent||'');
</script>
</body>
</html>
