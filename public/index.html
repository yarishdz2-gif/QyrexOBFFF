<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QyrexObf 1.0.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#06060c;
  --panel:#0d0d16;
  --border:#1e1e2e;
  --text:#e8e8f0;
  --muted:#7a7a94;
  --accent:#8b5cf6;
  --accent2:#22d3ee;
  --danger:#f43f5e;
  --ok:#34d399;
  --glow:rgba(139,92,246,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(139,92,246,.15), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.08), transparent 50%),
    var(--bg);
  color:var(--text);
  padding:28px 18px 48px;
}
.wrap{max-width:980px;margin:0 auto}
.header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  margin-bottom:22px;flex-wrap:wrap;
}
.brand h1{
  font-family:Orbitron,sans-serif;
  font-weight:800;font-size:clamp(1.4rem,3vw,2rem);
  letter-spacing:.06em;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{color:var(--muted);font-size:.78rem;margin-top:6px}
.badge{
  font-size:.7rem;padding:6px 10px;border-radius:999px;
  border:1px solid var(--border);color:var(--accent2);
  background:rgba(34,211,238,.06);
}
.grid{display:grid;gap:14px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.02),0 20px 50px rgba(0,0,0,.35);
}
.card label{
  display:block;font-size:.72rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;
}
textarea{
  width:100%;min-height:200px;resize:vertical;
  background:#08080f;color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  padding:14px;font:13px/1.5 "JetBrains Mono",monospace;
  outline:none;transition:border .15s,box-shadow .15s;
}
textarea:focus{
  border-color:rgba(139,92,246,.55);
  box-shadow:0 0 0 3px var(--glow);
}
.out{
  min-height:160px;max-height:380px;overflow:auto;
  white-space:pre-wrap;word-break:break-all;
}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{
  appearance:none;border:0;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:.85rem;
  padding:11px 16px;border-radius:10px;
  transition:transform .12s,filter .12s,background .12s;
}
button:active{transform:scale(.98)}
.btn-main{
  background:linear-gradient(135deg,var(--accent),#6d28d9);
  color:#fff;box-shadow:0 8px 24px rgba(139,92,246,.35);
}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{
  background:rgba(255,255,255,.04);
  color:var(--text);border:1px solid var(--border);
}
.btn-ghost:hover{background:rgba(255,255,255,.07)}
.stats{
  margin-top:10px;font-size:.72rem;color:var(--muted);
  display:flex;gap:12px;flex-wrap:wrap;
}
.stats b{color:var(--accent2);font-weight:600}
.toast{
  position:fixed;right:18px;bottom:18px;
  background:#12121c;border:1px solid var(--border);
  color:var(--text);padding:10px 14px;border-radius:10px;
  font-size:.8rem;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;transform:translateY(8px);
  z-index:50;
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}
.toast.err{border-color:rgba(244,63,94,.4);color:var(--danger)}
footer{
  margin-top:22px;text-align:center;color:var(--muted);font-size:.72rem;
}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{
  font-size:.65rem;padding:4px 8px;border-radius:6px;
  background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.2);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">
      <h1>QYREXOBF</h1>
      <p>qyrex.hopto.org · Luau symbol engine · anti-tamper</p>
    </div>
    <div class="badge">v1.0.0</div>
  </div>

  <div class="grid">
    <div class="card">
      <label>Input Lua / Luau</label>
      <textarea id="in" placeholder='print("EXECUTED_OK")'></textarea>
      <div class="row">
        <button class="btn-main" id="go">Obfuscate</button>
        <button class="btn-ghost" id="ex">Example</button>
        <button class="btn-ghost" id="clr">Clear</button>
      </div>
      <div class="tags">
        <span class="tag">symbol alphabet</span>
        <span class="tag">scramble</span>
        <span class="tag">anti-sandbox</span>
        <span class="tag">anti-hook</span>
        <span class="tag">single-line</span>
      </div>
    </div>

    <div class="card">
      <label>Output</label>
      <textarea id="out" class="out" readonly placeholder="Protected output appears here..."></textarea>
      <div class="row">
        <button class="btn-main" id="copy">Copy</button>
        <button class="btn-ghost" id="dl">Download</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <footer>Protected by QyrexObf v1.0.0 · qyrex.hopto.org</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const toast = (msg, ok=true) => {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.classList.remove('show'), 2200);
};
$('ex').onclick = () => { $('in').value = 'print("EXECUTED_OK")'; };
$('clr').onclick = () => { $('in').value=''; $('out').value=''; $('stats').textContent=''; };
$('go').onclick = async () => {
  const code = $('in').value;
  if (!code.trim()) return toast('Empty input', false);
  $('stats').textContent = 'Processing...';
  try {
    const r = await fetch('/api/obfuscate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'fail');
    $('out').value = j.code;
    const s = j.stats || {};
    $('stats').innerHTML =
      `<span>in <b>${s.inputBytes??'?'}</b> B</span>` +
      `<span>out <b>${s.outputBytes??'?'}</b> B</span>` +
      `<span>mode <b>${s.mode||'QyrexObf-1.0.0'}</b></span>` +
      `<span>verified <b>${s.verified?'yes':'no'}</b></span>`;
    toast('Obfuscated');
  } catch (e) {
    $('stats').textContent = '';
    toast(String(e.message || e), false);
  }
};
$('copy').onclick = async () => {
  const t = $('out').value;
  if (!t) return toast('Nothing to copy', false);
  await navigator.clipboard.writeText(t);
  toast('Copied');
};
$('dl').onclick = () => {
  const t = $('out').value;
  if (!t) return toast('Nothing to download', false);
  const blob = new Blob([t], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'qyrexobf_protected.lua';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Downloaded');
};
</script>
</body>
</html>
